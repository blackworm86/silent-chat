name = "alice-companion"
main = "worker/worker.ts"
compatibility_date = "2025-09-01"

# The built web app (npm run build) is served as static assets.
[assets]
directory = "./dist"

# One Durable Object (room) per game code. SQLite-backed => works on the free plan.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
